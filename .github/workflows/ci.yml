name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: test -z "$(gofmt -l kernel conformance/kernel registry registry/fs copilot)"

      - name: Build & Test
        run: go test ./kernel/... ./conformance/kernel/... && go build ./registry/... ./copilot/...

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "docs/index.html README.md --no-progress --offline"
          fail: true
